version: 2

sources:
  - name: raw
    database: youtube_db
    schema: raw
    tables:
      - name: trending_videos_raw
        description: "Raw trending videos data from YouTube API via S3"
      - name: video_categories_raw
        description: "Raw video categories data from YouTube API via S3"

models:
  - name: stg_videos
    description: "Staging model for trending videos - parsed and cleaned"
    columns:
      - name: video_id
        description: "Unique YouTube video ID"
        tests:
          - unique
          - not_null
      - name: title
        description: "Video title"
        tests:
          - not_null
      - name: channel_id
        description: "YouTube channel ID"
        tests:
          - not_null
      - name: view_count
        description: "Number of views"
        tests:
          - not_null
      
  - name: stg_channels
    description: "Staging model for channels - parsed and cleaned"
    columns:
      - name: channel_id
        description: "Unique YouTube channel ID"
        tests:
          - unique
          - not_null
      - name: channel_name
        description: "Channel name"
        tests:
          - not_null
      - name: subscriber_count
        description: "Number of subscribers"
